[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "phenostore-sdk-python"
version = "0.1.0"
description = "Python SDK for the Phenostore FHIR data API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Phenoml, Inc."}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28.1,<0.29",
  "attrs>=25.3,<27",
  "python-dateutil>=2.9,<3",
]

[project.urls]
Repository = "https://github.com/PhenoML/phenostore-sdk-python"

[dependency-groups]
dev = ["build>=1.3,<2", "pytest>=8.4,<10", "pytest-asyncio>=1.2,<2", "ruff==0.17.3", "mypy>=1.19,<2", "types-python-dateutil>=2.9", "trustme>=1.2,<2"]

[tool.hatch.build.targets.wheel]
packages = ["phenostore"]

[tool.hatch.build.targets.sdist]
include = ["/phenostore", "/api", "/tools", "/tests", "/examples", "/Makefile", "/openapi-python-client.yaml", "/uv.lock", "/README.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["phenostore/gen"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["phenostore"]
exclude = ["phenostore/gen"]
strict = true
