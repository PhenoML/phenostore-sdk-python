version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      python:
        patterns: ["*"]
      # Cover vulnerable transitive dependencies as well as direct ones.
      python-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /tools
    schedule:
      interval: monthly
    # Routine upgrades must regenerate and validate the SDK in the same PR.
    # Security updates remain enabled and also require regeneration.
    open-pull-requests-limit: 0
    groups:
      generator-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 30
    groups:
      actions:
        patterns: ["*"]
