name: Regenerate SDK

on:
  repository_dispatch:
    types: [spec-updated]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regenerate-sdk
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-suffix: python-3.11
          cache-dependency-glob: |
            uv.lock
            tools/uv.lock
      - name: Import upstream spec
        if: github.event_name == 'repository_dispatch'
        env:
          SPEC_B64: ${{ github.event.client_payload.spec_b64 }}
          SPEC_SHA: ${{ github.event.client_payload.spec_sha }}
        run: |
          python - <<'PY'
          import base64
          import os
          import re
          from pathlib import Path
          if not re.fullmatch(r"[a-fA-F0-9]{7,64}", os.environ["SPEC_SHA"]):
              raise SystemExit("spec_sha must be a hexadecimal commit or content identifier")
          spec = base64.b64decode(os.environ["SPEC_B64"], validate=True)
          if not spec:
              raise SystemExit("spec_b64 must contain the upstream OpenAPI document")
          Path("api/openapi.yaml").write_bytes(spec)
          PY
      - name: Generate client
        run: make install generate
      - name: Check SDK compatibility
        id: compatibility
        continue-on-error: true
        run: make test lint check-generated build
      - name: Adapt wrapper to generated changes
        id: adapt
        if: steps.compatibility.outcome == 'failure'
        uses: anthropics/claude-code-action@ed670b4cf9de2a5a570d130d2f6197b9e543cd64 # v1.0.240
        with:
          anthropic_organization_id: 3d765a0f-2011-4f41-ae8b-2c149547f81c
          anthropic_federation_rule_id: fdrl_015y7fnTfQ77N6Rpu2yqKfgW
          anthropic_service_account_id: svac_013MTiyRpDp6bsxf1589G3As
          anthropic_workspace_id: wrkspc_016wWcB4rGaSpRjCjwwQhcD4
          anthropic_oidc_audience: https://api.anthropic.com
          github_token: ${{ github.token }}
          prompt: Read and follow the instructions in .github/prompts/adapt-to-generated-changes.md
          claude_args: >-
            --model opus --max-turns 40
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(make:*),Bash(uv:*),Bash(git diff:*),Bash(git status:*)"
      - name: Verify adapted SDK
        if: steps.compatibility.outcome == 'failure'
        run: make test lint check-generated build
      - name: Open or update regeneration PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SPEC_SHA: ${{ github.event.client_payload.spec_sha }}
          PHENOSTORE_SHA: ${{ github.event.client_payload.phenostore_sha }}
          INCLUDE_WRAPPER_CHANGES: ${{ steps.adapt.outcome == 'success' }}
        run: bash .github/scripts/open-regeneration-pr.sh
